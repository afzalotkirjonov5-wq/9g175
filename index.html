<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Best Class</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap">
<style>
:root{color-scheme:dark;--bg-inner:#4a1a2f;--bg-mid:#1a0b17;--bg-outer:#0a050a;--glow:rgba(226,52,84,.30);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){color-scheme:light;--bg-inner:#ffe3e8;--bg-mid:#b97a93;--bg-outer:#5a3050;--glow:rgba(255,255,255,.45)}}
:root[data-theme="dark"]{--bg-inner:#4a1a2f;--bg-mid:#1a0b17;--bg-outer:#0a050a}
@property --t{syntax:'<number>';inherits:true;initial-value:0}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 38%,var(--bg-inner) 0%,var(--bg-mid) 58%,var(--bg-outer) 100%)}
.scene{perspective:1100px;perspective-origin:50% 35%;display:grid;place-items:center}
.glow{position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 68%);animation:glowPulse 8s ease-in-out infinite alternate;translate:0 -90px}
.plant{position:relative;width:14px;height:340px;margin-top:110px;transform-style:preserve-3d;transform-origin:50% 70%;animation:plantTurn 18s ease-in-out infinite alternate}
.ground-shadow{position:absolute;left:50%;bottom:-100px;width:200px;height:200px;margin-left:-100px;background:radial-gradient(circle,rgba(0,0,0,.55),transparent 62%);transform:rotateX(90deg)}
.stem-seg{position:absolute;left:50%;bottom:calc(100% - 1px);width:var(--w);height:var(--h,62px);margin-left:calc(var(--w)/-2);transform-origin:50% 100%;transform:rotate(var(--bend));transform-style:preserve-3d;background:linear-gradient(90deg,#12381a,#3f9a3b 45%,#1a4d22);animation:stemSway 6s ease-in-out infinite alternate;animation-delay:calc(var(--n)*-.5s)}
.stem-seg--root{position:absolute;bottom:0;left:50%;border-radius:7px 7px 0 0;transform-origin:50% 100%;animation:stemGrow 2.4s cubic-bezier(.2,.7,.2,1) both,stemSway 6s ease-in-out infinite alternate}
.thorn{position:absolute;top:var(--y);width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:14px solid #7a3a2a;transform-origin:50% 100%}
.thorn--r{left:calc(100% - 4px);rotate:72deg}.thorn--l{left:-4px;rotate:-72deg}
.leaf{position:absolute;bottom:28%;width:92px;height:42px;background:linear-gradient(100deg,#12401a,#2f8a3a 55%,#78c45f);box-shadow:inset 0 -6px 10px rgba(0,0,0,.3),0 5px 10px rgba(0,0,0,.3);transform:rotateX(var(--lean,18deg));animation:leafGrow 2.4s cubic-bezier(.2,.8,.2,1) var(--d) both,leafSway 5s ease-in-out var(--d) infinite alternate}
.leaf::after{content:"";position:absolute;top:50%;height:2px;width:84%;background:rgba(255,255,255,.3)}
.leaf--right{left:50%;transform-origin:0 50%;border-radius:0 100% 0 100%;--a:-30deg;rotate:var(--a)}.leaf--right::after{left:6%}
.leaf--left{right:50%;transform-origin:100% 50%;border-radius:100% 0 100% 0;--a:30deg;rotate:var(--a)}.leaf--left::after{right:6%}
.leaf--small{width:64px;height:30px}
.bloom{position:absolute;left:50%;top:2px;width:0;height:0;transform-style:preserve-3d;transform:rotateX(-28deg)}
.hip{position:absolute;left:-18px;top:-6px;width:36px;height:34px;border-radius:50% 50% 55% 55%;background:radial-gradient(circle at 35% 30%,#6dbb58,#1f5c26 72%)}
.layer{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;animation-duration:16s;animation-timing-function:cubic-bezier(.45,.05,.2,1);animation-delay:2.4s;animation-iteration-count:1;animation-fill-mode:both}
.layer--sepal{animation-name:openSepal}.layer--outer{animation-name:openOuter}.layer--mid{animation-name:openMid}.layer--inner{animation-name:openInner}.layer--core{animation-name:openCore}
.layer--outer{--step:72deg;--offset:0deg;--r:16px;--w:84px;--h:112px;--close:8deg;--open:-82deg;--wrap:22deg;--c0:#4a0716;--c1:#9e1230;--c2:#e0445a}
.layer--mid{--step:72deg;--offset:36deg;--r:11px;--w:70px;--h:94px;--close:12deg;--open:-60deg;--wrap:20deg;--c0:#5a0a1c;--c1:#b3173a;--c2:#f06a80}
.layer--inner{--step:90deg;--offset:18deg;--r:6px;--w:56px;--h:76px;--close:16deg;--open:-38deg;--wrap:18deg;--c0:#6b1024;--c1:#c42a4a;--c2:#ff9aa8}
.layer--core{--step:120deg;--offset:0deg;--r:2px;--w:42px;--h:58px;--close:18deg;--open:-14deg;--wrap:14deg;--c0:#7a1428;--c1:#d6405c;--c2:#ffb3bd}
.layer--sepal{--step:72deg;--offset:36deg;--r:4px;--w:24px;--h:58px;--close:6deg;--open:-118deg;--wrap:0deg}
.petal,.sepal{position:absolute;left:calc(var(--w)/-2);bottom:0;width:var(--w);height:var(--h);transform-origin:50% 100%;transform:rotateY(calc(var(--i)*var(--step) + var(--offset))) translateZ(var(--r)) rotateY(calc(var(--wrap)*(1 - var(--t)))) rotateX(calc(var(--close) + (var(--open) + var(--v,0deg) - var(--close))*var(--t)))}
.petal{border-radius:50% 50% 42% 42%/68% 68% 32% 32%;background:radial-gradient(ellipse at 50% 0%,var(--c2) 0%,transparent 55%),linear-gradient(to top,var(--c0) 0%,var(--c1) 55%,var(--c2) 100%);box-shadow:inset 0 -18px 24px rgba(0,0,0,.38),inset 0 8px 14px rgba(255,255,255,.12),0 6px 14px rgba(0,0,0,.35)}
.petal::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(255,255,255,.12) 45%,rgba(0,0,0,.22))}
.sepal{clip-path:polygon(50% 0,100% 100%,0 100%);background:linear-gradient(to top,#1a5a22,#4aa83e)}
@media (max-height:620px){.plant{scale:.8}}@media (max-height:500px){.plant{scale:.6}}@media (max-width:420px){.plant{scale:.85}.glow{width:360px;height:360px}}
@keyframes stemGrow{from{scale:1 0}to{scale:1 1}}
@keyframes stemSway{from{rotate:-1.4deg}to{rotate:1.4deg}}
@keyframes leafGrow{from{scale:0}to{scale:1}}
@keyframes leafSway{from{rotate:calc(var(--a) - 4deg)}to{rotate:calc(var(--a) + 5deg)}}
@keyframes plantTurn{from{transform:rotateY(-26deg)}to{transform:rotateY(26deg)}}
@keyframes glowPulse{from{opacity:.55;scale:.94}to{opacity:1;scale:1.06}}
@keyframes openSepal{0%,2%{--t:0}40%,100%{--t:1}}
@keyframes openOuter{0%,4%{--t:0}50%,100%{--t:1}}
@keyframes openMid{0%,14%{--t:0}62%,100%{--t:1}}
@keyframes openInner{0%,26%{--t:0}76%,100%{--t:1}}
@keyframes openCore{0%,40%{--t:0}88%,100%{--t:1}}
@media (prefers-reduced-motion:reduce){.plant,.glow{animation:none}.stem-seg{animation-name:none}.stem-seg--root{animation:stemGrow 2.4s cubic-bezier(.2,.7,.2,1) both}.leaf{animation:leafGrow 2.4s cubic-bezier(.2,.8,.2,1) var(--d) both}}


.scene{transition:opacity 3s ease 1.4s}.scene.gone{opacity:0}
.stage{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:5}
.wrap{position:absolute;left:0;top:50%;display:flex;align-items:center;gap:20px;width:max-content;height:min(64vh,49vw);margin-top:calc(min(64vh,49vw)/-2);visibility:hidden;will-change:transform}
.wrap img{height:100%;width:auto;flex:none;border:8px solid #fff8f4;border-radius:12px;box-shadow:0 0 60px rgba(255,120,150,.45),0 18px 40px rgba(0,0,0,.5)}
.wrap img:not(:first-child){opacity:0;transition:opacity 1.5s ease}
.wrap.go img{opacity:1}
.wrap img{pointer-events:auto;cursor:zoom-in}
.wrap:not(.go) img:not(:first-child){pointer-events:none}
.lightbox{position:fixed;inset:0;z-index:15;display:grid;place-items:center;background:rgba(10,5,10,.88);backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity .35s ease,visibility .35s;cursor:zoom-out}
.lightbox.open{opacity:1;visibility:visible}
.lightbox img{max-width:92vw;max-height:88vh;object-fit:contain;border:8px solid #fff8f4;border-radius:12px;box-shadow:0 0 60px rgba(255,120,150,.45),0 18px 40px rgba(0,0,0,.6);transform:scale(.92);transition:transform .35s ease}
.lightbox.open img{transform:scale(1)}
.lb-btn{position:absolute;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.4);color:#fff;border-radius:50%;width:44px;height:44px;font:22px system-ui,sans-serif;cursor:pointer;display:grid;place-items:center;padding:0}
.lb-prev{left:14px;top:50%;margin-top:-22px}.lb-next{right:14px;top:50%;margin-top:-22px}
.lb-close{right:14px;top:calc(14px + env(safe-area-inset-top,0px))}
.lb-count{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#fff;font:14px system-ui,sans-serif;opacity:.8}
.title{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:0 5vw;z-index:6;pointer-events:none}
.title span{font-family:'Great Vibes','Snell Roundhand','Brush Script MT',cursive;font-size:clamp(64px,15vw,170px);line-height:1.1;background:linear-gradient(100deg,#ffd9e0,#ff7a96 40%,#ffe2a8 70%,#ff9ab0);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(255,90,130,.6));clip-path:inset(-20% 100% -20% 0)}
.title.show span{animation:write 4s cubic-bezier(.5,.1,.3,1) forwards,float 5s ease-in-out 4s infinite alternate}
@keyframes write{to{clip-path:inset(-20% -5% -20% 0)}}
@keyframes float{to{translate:0 -8px;filter:drop-shadow(0 0 30px rgba(255,120,150,.9))}}
.again{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:7;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.35);color:#fff;border-radius:20px;padding:6px 14px;font:14px system-ui,sans-serif;cursor:pointer;opacity:0;transition:opacity 1s}
.again.show{opacity:1}
  
body:not(.started) *,body:not(.started) *::before,body:not(.started) *::after{animation-play-state:paused!important}
.start{position:fixed;inset:0;z-index:20;display:grid;place-items:center;transition:opacity 1s ease,visibility 1s}
.start.hide{opacity:0;visibility:hidden;pointer-events:none}
.start button{display:flex;align-items:center;gap:12px;padding:16px 38px;border-radius:40px;border:1px solid rgba(255,255,255,.5);background:linear-gradient(100deg,#c42a4a,#ff7a96);color:#fff;font:600 20px system-ui,sans-serif;letter-spacing:.04em;cursor:pointer;box-shadow:0 0 40px rgba(255,90,130,.55),0 10px 30px rgba(0,0,0,.4);animation:startPulse 2.4s ease-in-out infinite alternate;transition:transform .2s}
.start button:hover{transform:scale(1.06)}
.start button:active{transform:scale(.97)}
.start button i{font-style:normal;font-size:18px}
@keyframes startPulse{from{box-shadow:0 0 24px rgba(255,90,130,.4),0 10px 30px rgba(0,0,0,.4)}to{box-shadow:0 0 60px rgba(255,120,150,.9),0 10px 30px rgba(0,0,0,.4)}}
</style></head>
<body>
<main class="scene" id="scene"><div class="glow"></div>
<div class="plant"><div class="ground-shadow"></div>
<div class="stem-seg stem-seg--root" style="--w:14px;--bend:4deg;--n:0"><span class="thorn thorn--r" style="--y:60%"></span><span class="thorn thorn--l" style="--y:25%"></span>
<div class="stem-seg" style="--w:13px;--bend:4deg;--n:1"><span class="leaf leaf--right" style="--d:1.0s"></span><span class="thorn thorn--r" style="--y:20%"></span>
<div class="stem-seg" style="--w:12px;--bend:2deg;--n:2"><span class="thorn thorn--l" style="--y:50%"></span>
<div class="stem-seg" style="--w:11px;--bend:-4deg;--n:3"><span class="leaf leaf--left" style="--d:1.4s;--lean:-16deg"></span><span class="thorn thorn--r" style="--y:35%"></span>
<div class="stem-seg" style="--w:10px;--bend:-5deg;--n:4"><span class="leaf leaf--right leaf--small" style="--d:1.8s"></span>
<div class="stem-seg" style="--w:9px;--h:30px;--bend:-4deg;--n:5">
<div class="bloom"><div class="hip" id="hip"></div>
<div class="layer layer--sepal"><i class="sepal" style="--i:0"></i><i class="sepal" style="--i:1"></i><i class="sepal" style="--i:2"></i><i class="sepal" style="--i:3"></i><i class="sepal" style="--i:4"></i></div>
<div class="layer layer--outer"><i class="petal" style="--i:0;--v:-4deg"></i><i class="petal" style="--i:1;--v:3deg"></i><i class="petal" style="--i:2;--v:-2deg"></i><i class="petal" style="--i:3;--v:5deg"></i><i class="petal" style="--i:4;--v:-5deg"></i></div>
<div class="layer layer--mid"><i class="petal" style="--i:0;--v:3deg"></i><i class="petal" style="--i:1;--v:-4deg"></i><i class="petal" style="--i:2;--v:2deg"></i><i class="petal" style="--i:3;--v:-3deg"></i><i class="petal" style="--i:4;--v:4deg"></i></div>
<div class="layer layer--inner"><i class="petal" style="--i:0;--v:-3deg"></i><i class="petal" style="--i:1;--v:3deg"></i><i class="petal" style="--i:2;--v:-2deg"></i><i class="petal" style="--i:3;--v:2deg"></i></div>
<div class="layer layer--core"><i class="petal" style="--i:0;--v:0deg"></i><i class="petal" style="--i:1;--v:0deg"></i><i class="petal" style="--i:2;--v:0deg"></i></div>
</div></div></div></div></div></div></div></div></main>
<div class="stage"><div class="wrap" id="wrap"></div></div>
<div class="title" id="title"><span>My Best Class</span></div>
<div class="start" id="start"><button id="startBtn" type="button"><i>▶</i> Запустить</button></div>
<div class="lightbox" id="lightbox"><img id="lbImg" alt=""><button class="lb-btn lb-prev" id="lbPrev" type="button" aria-label="Назад">‹</button><button class="lb-btn lb-next" id="lbNext" type="button" aria-label="Вперёд">›</button><button class="lb-btn lb-close" id="lbClose" type="button" aria-label="Закрыть">×</button><div class="lb-count" id="lbCount"></div></div>
<button class="again" id="again" onclick="location.reload()">↻</button>
<script>
const IMGS=["photo1.jpg", "photo2.jpg", "photo3.jpg", "photo4.jpg", "photo5.jpg", "photo6.jpg", "photo7.jpg", "photo8.jpg", "photo9.jpg", "photo10.jpg", "photo11.jpg"];
const wrap=document.getElementById('wrap');
const startP=new Promise(r=>{window.__start=r;});
const EMERGE=15400, SPEED=55;
Promise.all([Promise.all(IMGS.map(s=>new Promise(res=>{
  const i=new Image();
  i.onload=()=>res(i);
  i.onerror=()=>{console.warn('Не найден файл:',s);res(null);};
  i.alt='';i.src=s;
}))),startP]).then(([list])=>{
const slides=list.filter(Boolean);
slides.forEach(i=>wrap.appendChild(i));
window.__slides=slides;
if(!slides.length){console.error('Ни одна картинка не загрузилась. Проверьте пути в IMGS.');return;}
setTimeout(()=>{
  const r=document.getElementById('hip').getBoundingClientRect();
  const dx=r.left+r.width/2-innerWidth/2, dy=r.top+r.height/2-innerHeight/2;
  const first=slides[0];
  const x0=(innerWidth-first.offsetWidth)/2;
  wrap.style.transform=`translateX(${x0}px)`;
  wrap.style.visibility='visible';
  first.animate([
    {transform:`translate(${dx}px,${dy}px) scale(.03) rotate(-8deg)`,opacity:0},
    {opacity:1,offset:.3},
    {transform:'translate(0,0) scale(1) rotate(0deg)',opacity:1}
  ],{duration:3600,easing:'cubic-bezier(.2,.75,.2,1)',fill:'both'});
  document.getElementById('scene').classList.add('gone');
  setTimeout(()=>{
    const w=wrap.offsetWidth;
    wrap.classList.add('go');
    const a=wrap.animate([{transform:`translateX(${x0}px)`},{transform:`translateX(${-w}px)`}],{duration:(x0+w)/SPEED*1000,easing:'linear',fill:'forwards'});
    window.__slideAnim=a;
    a.onfinish=()=>{
      document.getElementById('title').classList.add('show');
      setTimeout(()=>document.getElementById('again').classList.add('show'),4500);
    };
  },6000);
},EMERGE);
});
</script>
<script>
(function(){
  const lb=document.getElementById('lightbox'),lbImg=document.getElementById('lbImg'),lbCount=document.getElementById('lbCount');
  let idx=0,wasRunning=false;
  const list=()=>window.__slides||[];
  function show(i){
    const s=list();if(!s.length)return;
    idx=(i+s.length)%s.length;
    lbImg.src=s[idx].src;
    lbCount.textContent=(idx+1)+' / '+s.length;
  }
  function open(i){
    const a=window.__slideAnim;
    wasRunning=!!a&&a.playState==='running';
    if(wasRunning)a.pause();
    show(i);
    lb.classList.add('open');
  }
  function close(){
    if(!lb.classList.contains('open'))return;
    lb.classList.remove('open');
    const a=window.__slideAnim;
    if(wasRunning&&a&&a.playState==='paused')a.play();
    wasRunning=false;
  }
  document.getElementById('wrap').addEventListener('click',e=>{
    const img=e.target.closest('img');if(!img)return;
    const i=list().indexOf(img);if(i>=0)open(i);
  });
  lb.addEventListener('click',e=>{if(e.target===lb||e.target===lbImg)close();});
  document.getElementById('lbClose').addEventListener('click',close);
  document.getElementById('lbPrev').addEventListener('click',e=>{e.stopPropagation();show(idx-1);});
  document.getElementById('lbNext').addEventListener('click',e=>{e.stopPropagation();show(idx+1);});
  document.addEventListener('keydown',e=>{
    if(!lb.classList.contains('open'))return;
    if(e.key==='Escape')close();
    else if(e.key==='ArrowLeft')show(idx-1);
    else if(e.key==='ArrowRight')show(idx+1);
  });
})();
</script>
<audio id="myAudio" src="cinnamon-girl.mp3" loop preload="auto"></audio>
<script>
document.getElementById('startBtn').addEventListener('click',()=>{
  const audio=document.getElementById('myAudio');
  audio.play().catch(e=>console.log('Не удалось запустить звук:',e));
  document.body.classList.add('started');
  document.getElementById('start').classList.add('hide');
  window.__start();
},{once:true});
</script>
</body></html>
